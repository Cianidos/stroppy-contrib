name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream drift shows up here before it shows up in a release.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  examples:
    name: ${{ matrix.example }} (pinned SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [select1, selectfile]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Run against noop
        run: go run . -d noop --iterations 2

  contract:
    name: ${{ matrix.example }} (Stroppy main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [select1, selectfile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Check out Stroppy main
        uses: actions/checkout@v4
        with:
          repository: stroppy-io/stroppy
          ref: main
          path: stroppy-main
      - name: Compile the example against main
        working-directory: ${{ matrix.example }}
        run: |
          go mod edit -replace github.com/stroppy-io/stroppy/v6="$GITHUB_WORKSPACE/stroppy-main"
          go mod tidy
          go build ./...
          go test ./...
